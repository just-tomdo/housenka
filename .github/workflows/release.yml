# Publishes a GitHub release with prebuilt binaries for every pushed v* tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish
        # A release drafted by hand in the GitHub UI just gets the binaries attached.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
